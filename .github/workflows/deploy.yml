name: deploy

# Deploys main to Cloudflare. Deploys are otherwise run by hand; this exists so
# a job that changes what the Worker bundles -- the yearly normals -- can ship
# its own result instead of leaving a reminder for someone to deploy in June.
#
# Tests run first, against the commit being deployed, so a bad recompute stops
# here: test/normals.test.ts checks the committed figures themselves.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # main, not the triggering commit: when the normals job calls this, it
      # has just pushed a new commit that the caller's checkout predates.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
