name: deploy

# Deploys main to Cloudflare. Deploys are otherwise run by hand; this exists so
# a job that changes what the Worker bundles -- the yearly normals -- can ship
# its own result instead of leaving a reminder for someone to deploy in June.
#
# Tests run first, against the commit being deployed, so a bad recompute stops
# here: test/normals.test.ts checks the committed figures themselves.

on:
  workflow_dispatch:
  workflow_call:

# write, to push the deploy- tag scripts/deploy.mjs creates. A caller's
# permissions cap these; normals.yml already grants contents: write.
permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # main, not the triggering commit: when the normals job calls this, it
      # has just pushed a new commit that the caller's checkout predates.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Deploys and tags the commit that went live (standards §7).
      - name: Deploy and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
