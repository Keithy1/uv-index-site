name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # The same credential shapes the pre-commit hook refuses, checked here on
  # every push. The hook only runs on a machine that has opted in
  # (core.hooksPath); this repository is public, so the check that cannot be
  # skipped belongs where everyone's commits arrive.
  secrets:
    name: No credentials in the repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan every tracked file
        run: |
          found=$(git ls-files -z | grep -zv '^scripts/secret-patterns.txt$' \
            | xargs -0 grep -InE -f scripts/secret-patterns.txt || true)
          if [ -n "$found" ]; then
            # File and line only: printing the match would publish it again.
            echo "$found" | cut -d: -f1,2
            echo "::error::Something shaped like a credential is committed. Revoke it first, then remove it."
            exit 1
          fi
          echo "clean"

  worker:
    name: Worker (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build for the Workers runtime
        # Catches anything that typechecks but cannot be bundled for workerd.
        run: npx wrangler deploy --dry-run --outdir /tmp/dist

  fetchers:
    name: Fetchers (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The same packages the fetch jobs install. Without them the CAMS tests
      # could not import numpy, and this job failed on every push from at
      # least 26 October while the suite passed on a machine that happened to
      # have numpy -- a red CI nobody was reading.
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s fetch/tests -t . -v
