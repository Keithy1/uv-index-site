name: normals

# Recomputes the "this time of year" figures for every city and commits
# data/normals.json, which the Worker bundles. See fetch/normals.py.
#
# Once a year is plenty: a normal over ten years barely moves when an eleventh
# arrives. June, because ARPANSA has published the previous year's CSVs by then
# and NOAA's archive has its previous year too.
#
# When the figures change, the deploy workflow runs after the commit, so the
# new normals reach the site without anyone having to remember. Deploys are
# otherwise by hand on this project; this is the one job that ships its own.

on:
  workflow_dispatch:
    inputs:
      au_years:
        description: "ARPANSA years, e.g. 2016-2025"
        required: true
        default: "2016-2025"
      us_years:
        description: "NOAA bulletin years, e.g. 2015-2024"
        required: true
        default: "2015-2024"
  schedule:
    - cron: "17 3 1 6 *"

permissions:
  contents: write

jobs:
  normals:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    # ~130 ARPANSA CSVs of ~21 MB each, read and deleted one at a time, then
    # ~3,650 NOAA bulletins fetched one by one with a pause between them.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Standard library only -- no requirements to install.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute
        run: >
          python -m fetch.normals
          --au-years "${{ inputs.au_years || '2016-2025' }}"
          --us-years "${{ inputs.us_years || '2015-2024' }}"

      # Kept whatever happens next. The first full run computed for fifty
      # minutes and then lost everything to a rejected push; with the file
      # saved here, a failure after this point costs a download, not a re-run.
      - name: Keep the result
        uses: actions/upload-artifact@v4
        with:
          name: normals
          path: data/normals.json
          retention-days: 30

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/normals.json; then
            echo "normals unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normals.json
          git commit -m "Monthly UV normals, recomputed by the normals workflow"
          # main will usually have moved during a run this long -- the first
          # one's push was rejected for exactly that. This job only ever
          # touches data/normals.json, so a rebase onto the new main is clean.
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Ships the new figures. Tests run first inside deploy.yml, and
  # test/normals.test.ts checks the committed file, so a bad recompute is
  # stopped before it reaches a page.
  deploy:
    needs: normals
    if: needs.normals.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
