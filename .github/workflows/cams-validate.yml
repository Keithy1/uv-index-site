name: cams-validate

# Compares a CAMS forecast against what ARPANSA actually measured, hour by hour.
# This is the check that decides whether a CAMS-derived UV index may be
# published. It answers two separate questions:
#
#   1. Is UVI = rate x 40 right? Fitted on cloudless hours only, so a cloud
#      error cannot be mistaken for a units error. The GRIB carries no units,
#      so this is the only evidence we have.
#   2. How accurate is the forecast? Bias and mean absolute error across all
#      daylight hours. This is the figure the methods page should quote.
#
# 2025 is the most recent complete year of ARPANSA history on data.gov.au, so
# both default periods sit inside it: early January (peak summer, the season
# the site is built for) and mid-October (spring).

on:
  workflow_dispatch:
    inputs:
      station:
        description: "Station key, or 'all' for every ARPANSA station"
        required: true
        default: "all"
      dates:
        description: "Comma-separated first days, one per period"
        required: true
        default: "2025-01-08,2025-10-14"
      days:
        description: "Days per period"
        required: true
        default: "14"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Thirteen yearly CSVs are ~270 MB in total and each CAMS retrieve queues
    # before it downloads, so this is far slower than a single-station run.
    timeout-minutes: 120
    env:
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # A cache key may not contain a comma, and `dates` is comma-separated,
      # so derive a safe key rather than interpolating the input directly.
      - name: Cache key
        id: cachekey
        run: |
          safe=$(printf '%s' "${{ inputs.dates }}" | tr ',' '_' | tr -cd 'A-Za-z0-9_.-')
          echo "key=$safe" >> "$GITHUB_OUTPUT"

      # ARPANSA's yearly files never change once published, so caching them
      # turns a ~270 MB download into a few seconds on later runs.
      - name: Cache ARPANSA history
        uses: actions/cache@v4
        with:
          path: arpansa-cache
          key: arpansa-history-v1-${{ steps.cachekey.outputs.key }}
          restore-keys: |
            arpansa-history-v1-

      - name: Validate
        run: |
          python -m fetch.cams_validate \
            --station "${{ inputs.station }}" \
            --dates "${{ inputs.dates }}" \
            --days "${{ inputs.days }}"
