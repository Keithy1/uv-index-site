name: fetch-and-publish

on:
  schedule:
    - cron: "*/5 * * * *" # ARPANSA measured readings, every 5 minutes
  workflow_dispatch:
  push:
    paths:
      - "fetch/**"
      - ".github/workflows/fetch-and-publish.yml"

permissions:
  contents: read

concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
      R2_BUCKET: uvatlas-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s fetch/tests -v

      - name: Fetch ARPANSA (measured, AU)
        run: python fetch/main.py --source arpansa --out data

      - name: Fetch EPA (forecast, US)
        run: python fetch/main.py --source epa --out data

      - name: Fetch CAMS (forecast)
        if: env.ADS_API_KEY != ''
        run: python fetch/main.py --source cams --out data

      - name: Health file
        run: python fetch/health.py data

      - name: Publish to R2
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: |
          npm install -g wrangler
          wrangler r2 object put "$R2_BUCKET/data/latest.json" --file data/latest.json --account-id "$CF_ACCOUNT_ID"
          wrangler r2 object put "$R2_BUCKET/health.json" --file data/health.json --account-id "$CF_ACCOUNT_ID"
