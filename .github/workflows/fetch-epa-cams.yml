name: fetch-epa-cams

# The two sources that cannot run inside a Cloudflare Worker on the free plan:
#   * EPA needs ~100 subrequests per run and the free limit is 50;
#   * CAMS ships GRIB that needs real numerical processing.
# Both are forecasts, so a late run costs nothing a visitor would see. ARPANSA
# -- the one source where minutes matter -- is fetched by the Worker's own
# cron, because GitHub's scheduler is best-effort and this repository measured
# it delivering 2.7% of a */5 schedule.
#
# The fetchers write .sql and wrangler applies it, which is the same path the
# schema uses: one way into the database, one set of credentials.

on:
  # No schedule: the Worker's five-minute cron is the clock and asks for each
  # run through the API (src/lib/dispatch.ts, scheduledFetch). GitHub started
  # 15 of about 72 scheduled hourly runs from 25 to 28 October 2026; every run
  # asked for through the API ran.
  workflow_dispatch:
    inputs:
      source:
        description: Which fetch to run
        type: choice
        options: [all, epa, cams]
        default: all

permissions:
  contents: read

concurrency:
  group: fetch-epa-cams
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Tests
        run: python -m unittest discover -s fetch/tests -t . -v

      - name: Fetch
        id: fetch
        # Keep going on a source failure: the SQL that did succeed is still
        # worth applying, and the health row records what went wrong.
        continue-on-error: true
        run: python -m fetch.main --source "${{ inputs.source || 'all' }}" --out sql

      - name: Write to D1
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          shopt -s nullglob
          files=(sql/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no SQL produced" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "applying $f"
            npx wrangler d1 execute uvatlas --remote --file="$f" --yes
          done

      - name: Report
        run: |
          if [ "${{ steps.fetch.outcome }}" != "success" ]; then
            echo "a source failed; see the Fetch step" >&2
            exit 1
          fi
