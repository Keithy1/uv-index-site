name: fetch-epa-cams

# The two sources that cannot run inside a Cloudflare Worker on the free plan:
#   * EPA needs ~100 subrequests per run and the free limit is 50;
#   * CAMS ships GRIB that needs real numerical processing.
# Both are forecasts, so a late run costs nothing a visitor would see. ARPANSA
# -- the one source where minutes matter -- is fetched by the Worker's own
# cron, because GitHub's scheduler is best-effort and this repository measured
# it delivering 2.7% of a */5 schedule.
#
# The fetchers write .sql and wrangler applies it, which is the same path the
# schema uses: one way into the database, one set of credentials.

on:
  workflow_dispatch:
  schedule:
    # EPA publishes hourly; off the top of the hour, which is less contended.
    - cron: "23 * * * *"
    # CAMS: after today's 00Z run reaches the ADS (ECMWF delivers it at 10:00
    # UTC; the ADS has been later), then a retry. Only the 00Z run is fetched.
    # This was "40 7,19" from 25 to 28 October 2026, meant as "after the 00Z
    # and 12Z runs": 07:40 is before the 00Z run exists, and 12Z is never
    # requested, so both runs re-fetched data already held. fetch/cams.py now
    # fails a fetch that misses the run it should have got.
    - cron: "40 10,13 * * *"

permissions:
  contents: read

concurrency:
  group: fetch-epa-cams
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Tests
        run: python -m unittest discover -s fetch/tests -t . -v

      # CAMS only runs on its own schedule: it is a ~5 MB download and the
      # run we fetch changes once a day, so fetching it hourly would be waste.
      - name: Decide which sources to fetch
        id: pick
        run: |
          if [ "${{ github.event.schedule }}" = "23 * * * *" ]; then
            echo "source=epa" >> "$GITHUB_OUTPUT"
          else
            echo "source=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch
        id: fetch
        # Keep going on a source failure: the SQL that did succeed is still
        # worth applying, and the health row records what went wrong.
        continue-on-error: true
        run: python -m fetch.main --source "${{ steps.pick.outputs.source }}" --out sql

      - name: Write to D1
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          shopt -s nullglob
          files=(sql/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no SQL produced" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "applying $f"
            npx wrangler d1 execute uvatlas --remote --file="$f" --yes
          done

      - name: Report
        run: |
          if [ "${{ steps.fetch.outcome }}" != "success" ]; then
            echo "a source failed; see the Fetch step" >&2
            exit 1
          fi
